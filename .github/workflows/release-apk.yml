name: Android release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish without moving it
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/share/chromium
          echo "Disk space after cleanup:"
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build arm64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
        env:
          KETSUREN_NO_DISCORD: '1'
      - name: Build universal-compatible release APK
        run: flutter build apk --release
        env:
          KETSUREN_NO_DISCORD: '1'
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Ketsuren-${RELEASE_TAG}-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Ketsuren-${RELEASE_TAG}-universal.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
