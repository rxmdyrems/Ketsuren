name: Android release APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build arm64 release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
        env:
          KETSUREN_NO_DISCORD: '1'
      - name: Build universal-compatible release APK
        run: flutter build apk --release
        env:
          KETSUREN_NO_DISCORD: '1'
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/Ketsuren-${GITHUB_REF_NAME}-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/Ketsuren-${GITHUB_REF_NAME}-universal.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
